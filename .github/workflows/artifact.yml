name: artifacts 1
on: push
jobs:
  build:
    runs-on: unbuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: npm ci
      - run: npm run build

    test:
      runs-on: unbuntu-latest
      steps:
        - uses: actions/checkout@v3
        - run: npm ci
        - run: npm test -- --coverage